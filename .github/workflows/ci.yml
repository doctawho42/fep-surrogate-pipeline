name: ci

# NOTE: this project currently lives untracked inside the catch-all
# ~/PycharmProjects git repo. This workflow documents the canonical CI gate
# and will activate once fluor_screening/ is its own repo (or a path filter is
# added at the monorepo root). Locally, `make check` is the equivalent gate.

on:
  push:
    paths: ["fluor_screening/**", "**"]
  pull_request:

defaults:
  run:
    working-directory: fluor_screening

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest

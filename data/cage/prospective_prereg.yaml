version: 1
description: >
  Pre-registered prospective target-ID forecast + decision constants for the difluoronaphthalenone
  "cage". Frozen BEFORE any wet data (provenance = this file's git commit; immutability anchored by
  a SHA-256 pinned externally in tests/test_prospective.py). Follows K1 + TERMINAL C: retrospective
  structure-vs-similarity is undecidable, so the cage requires prospective validation. This makes NO
  target claim.
species:
  - {id: RR-OAc, enantiomer: "R,R", form: acetate,  smiles: "CC(=O)O[C@]12C[C@H](c3ccccc3C1(F)F)c1c([nH]c(=O)[nH]c1=O)O2"}
  - {id: SS-OAc, enantiomer: "S,S", form: acetate,  smiles: "CC(=O)O[C@@]12C[C@@H](c3ccccc3C1(F)F)c1c([nH]c(=O)[nH]c1=O)O2"}
  - {id: RR-OH,  enantiomer: "R,R", form: deacetyl, smiles: "O=c1[nH]c2c(c(=O)[nH]1)[C@@H]1C[C@](O)(O2)C(F)(F)c2ccccc21"}
  - {id: SS-OH,  enantiomer: "S,S", form: deacetyl, smiles: "O=c1[nH]c2c(c(=O)[nH]1)[C@H]1C[C@@](O)(O2)C(F)(F)c2ccccc21"}
forecast:
  F1:
    scored: true
    statement: "No confident specific target; in-silico is exhausted, the prospective un-blinder decides."
    refuted_by: "Any reproducible, LCB-passing, detergent-surviving specific engagement in Step 1/2."
  F2:
    scored: true
    statement: "If any nuclear-receptor signal exists it is weak and steroid-family (GR/AR), NOT ER."
    evidence: "Boltz gap vs anchor: GR -0.524, AR -0.402, ER -0.700 (ER most rejected)."
    refuted_by: "A strong, agonist-comparable NR signal (especially an ER-selective one)."
  F3:
    scored: false
    statement: >
      CONTEXT, not a scored forecast: docking ranked GR >= AR (GR 80-89% / AR 75-89% percentile);
      Boltz residual preference is AR > GR (opposite). True regardless of any wet result -> not
      falsifiable; recorded as the rationale for the pre-registered steroid-rescue clause.
  F4:
    scored: conditional
    condition: steroid_rescue
    statement: "In-silico best-enantiomer per steroid target (Boltz best-form)."
    per_target: {GR: SS-OAc, AR: RR-OAc, ER: RR-OAc}
    note: "Scored ONLY if the steroid-rescue branch fires; otherwise not_testable, never refuted."
  F5:
    scored: true
    statement: "Promiscuity/aggregation prior: any signal is detergent-sensitive; if pure aggregation, no reproducible R,R-vs-S,S discordance."
    evidence: "The cyclic-ureide (barbiturate) head is a strong promiscuous H-bonder + colloidal-aggregation risk."
    refuted_by: "A detergent-surviving, enantiodiscordant signal."
decision:
  z: 1.645
  tau: {CP: 0.35, DSF: 2.0, reporter: 0.30}
  tau_units: {CP: "morphological distance to vehicle (assay-normalized)", DSF: "delta Tm (deg C)", reporter: "fraction of agonist-max response"}
  frac: 0.5
  stop_bound: 0.90
  enantiopreference: {rule: "CI on (R,R - S,S) at z with sigma_delta = sqrt(sigma_rr^2 + sigma_ss^2); discordant iff 0 outside CI"}
  min_replicates:
    value: 3
    power_justification: >
      sigma_assay = sigma_rep / sqrt(n). To pass LCB with margin m = effect - tau at z=1.645 we need
      sigma_assay <= m/z, i.e. n >= (z * sigma_rep / m)^2. For the DSF anchor (tau=2 deg C, an
      expected engaged-target shift ~3 deg C -> m=1 deg C, assumed sigma_rep ~1 deg C):
      n >= (1.645 * 1 / 1)^2 = 2.7 -> 3. Rounded up to a 3-replicate technical-noise floor.
disposition_table:
  - {lcb: pass, enantiodiscordant: true,  survives: true, disposition: HIT}
  - {lcb: pass, enantiodiscordant: false, survives: true, disposition: ambiguous-engagement}
  - {lcb: pass, enantiodiscordant: any,   survives: false, disposition: aggregation-artifact}
  - {lcb: fail, enantiodiscordant: true,  survives: true, disposition: inconclusive-but-suggestive}
  - {lcb: fail, enantiodiscordant: false, survives: any,  disposition: F5-confirmed-promiscuous}
  - {lcb: fail, enantiodiscordant: true,  survives: false, disposition: aggregation-artifact}
